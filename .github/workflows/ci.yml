name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check services tests mcp

      - name: Pytest
        run: pytest tests -q

      - name: Validate example fact bank
        run: python -m services.tailoring.validate_cv data/master_cv.example.json
