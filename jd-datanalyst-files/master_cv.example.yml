# =============================================================================
# MASTER CV  —  your single source of truth
# =============================================================================
# The tailoring tool ONLY ever uses content from this file. It selects,
# reorders, and rephrases what is here to match a job description. It never
# invents anything. That is the whole point: tailoring without deception.
#
# RULES:
#  - Every line in here must be TRUE. If it isn't true, delete it.
#  - Fill in the [BRACKETED] placeholders with your real details.
#  - Set skill "level" honestly. It drives whether a match is reported as a
#    STRONG match or only a PARTIAL one:
#       core    = you can do this unsupervised, on the job, today
#       working = you've used it in real projects but not professionally
#       familiar= you've learned it but have limited hands-on depth
#  - Tag each bullet/project with the skills it genuinely demonstrates.
# =============================================================================

