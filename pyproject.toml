[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobhunt"
version = "0.1.0"
description = "Autonomous & honest job acquisition engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jsonschema>=4.22",
    "openai>=1.40",
    "extruct>=0.16",
    "w3lib>=2.2",
    "fpdf2>=2.7",
    "mcp>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6", "pytest>=8.0"]
stealth = ["camoufox[geoip]>=0.4", "seleniumbase>=4.29"]
apply = ["playwright>=1.47"]

[project.scripts]
jobhunt = "services.orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["services*", "mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
